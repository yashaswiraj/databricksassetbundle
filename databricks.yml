bundle:
  name: dab_learning
  uuid: c2052e2a-3ada-446e-8cc8-c2ace19266b5

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog: 
    description: The catalog to use
  schema: 
    description: The schema to use

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-df56fd26-1a11.cloud.databricks.com/
    variables:
      catalog: test
      schema: ${workspace.current_user.short_name}
    presets:
      name_prefix: ${workspace.current_user.short_name}
      source_linked_deployment : false

  prod:
    mode: production
    workspace:
      host: https://dbc-df56fd26-1a11.cloud.databricks.com/
      root_path: /Workspace/PROD/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: test
      schema: prod
    permissions:
      - user_name: yashaswiraj58@gmail.com
        level: CAN_MANAGE
    presets:
      name_prefix: prod


